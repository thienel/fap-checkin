<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#164e63" />
    <title>FAP Check Attendance</title>
  </head>
  <body>
    <main class="page-shell">
      <section class="card">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M3 3h7v7H3V3Zm2 2v3h3V5H5Zm9-2h7v7h-7V3Zm2 2v3h3V5h-3ZM3 14h7v7H3v-7Zm2 2v3h3v-3H5Zm9-2h3v3h-3v-3Zm4 0h3v7h-3v-3h-2v3h-2v-3h3v-2h1v-2Z" />
          </svg>
        </div>
        <p class="eyebrow">FAP CHECK ATTENDANCE</p>
        <h1 id="title" tabindex="-1">Xác nhận điểm danh</h1>
        <p id="message" class="message">
          Đăng nhập bằng tài khoản Google trước khi mã QR hết hạn.
        </p>

        <div id="status" class="status hidden" aria-hidden="true"></div>
        <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

        <button id="sign-in" class="primary-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.06H12v3.9h5.38a4.6 4.6 0 0 1-2 3.02v2.53h3.24c1.9-1.75 2.98-4.33 2.98-7.39Z"/>
            <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.38l-3.24-2.53c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.77-5.61-4.14H3.04v2.61A10 10 0 0 0 12 22Z"/>
            <path fill="#FBBC05" d="M6.39 13.91A6.02 6.02 0 0 1 6.07 12c0-.66.11-1.3.32-1.91V7.48H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.52l3.35-2.61Z"/>
            <path fill="#EA4335" d="M12 5.95c1.47 0 2.79.51 3.83 1.5l2.87-2.88A9.63 9.63 0 0 0 12 2a10 10 0 0 0-8.96 5.48l3.35 2.61C7.18 7.72 9.39 5.95 12 5.95Z"/>
          </svg>
          Tiếp tục với Google
        </button>

        <form id="checkout-form" class="checkout-form hidden">
          <label class="field-label" for="checkout-code">Mã xác nhận điểm danh</label>
          <input
            id="checkout-code"
            name="checkoutCode"
            type="text"
            inputmode="text"
            autocomplete="one-time-code"
            autocapitalize="characters"
            minlength="5"
            maxlength="5"
            pattern="[A-Za-z0-9]{5}"
            aria-describedby="code-help code-error"
            spellcheck="false"
            required
          />
          <p id="code-help" class="field-help">Mã xác nhận gồm 5 ký tự chữ hoặc số.</p>
          <p id="code-error" class="field-error" aria-live="polite"></p>
          <button id="checkout-submit" class="primary-button" type="submit">
            Xác nhận điểm danh
          </button>
          <button id="switch-account" class="secondary-button" type="button">
            Đổi tài khoản Google
          </button>
        </form>

        <p class="privacy">
          Hệ thống dùng email Google và mã xác nhận để điểm danh.
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
